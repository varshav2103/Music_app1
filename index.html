<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varsha Music App</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1d2671, #c33764);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
}

.app {
    width: 380px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.1);
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

.album-cover {
    width: 100%;
    height: 220px;
    border-radius: 20px;
    object-fit: cover;
    margin-bottom: 15px;
}

.song-title {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
}

.progress-container {
    background: rgba(255,255,255,0.2);
    height: 6px;
    border-radius: 5px;
    margin: 15px 0;
    cursor: pointer;
}

.progress {
    background: #00ffd5;
    height: 100%;
    width: 0%;
    border-radius: 5px;
}

.time {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
}

.controls {
    display: flex;
    justify-content: center;
    margin: 15px 0;
}

.controls button {
    background: white;
    color: black;
    border: none;
    margin: 0 10px;
    padding: 10px 15px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.controls button:hover {
    transform: scale(1.1);
}

.volume {
    margin-top: 10px;
}

.volume input {
    width: 100%;
}

.song-list {
    margin-top: 15px;
    max-height: 120px;
    overflow-y: auto;
}

.song-item {
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 5px;
    transition: 0.3s;
}

.song-item:hover {
    background: rgba(255,255,255,0.2);
}

.song-item.active {
    background: #00ffd5;
    color: black;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="app">
    <img id="cover" class="album-cover" src="">
    <div class="song-title" id="title">Loading...</div>

    <audio id="audio"></audio>

    <div class="progress-container" id="progressContainer">
        <div class="progress" id="progress"></div>
    </div>

    <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
        <button onclick="prevSong()">⏮</button>
        <button onclick="playPause()" id="playBtn">▶</button>
        <button onclick="nextSong()">⏭</button>
    </div>

    <div class="volume">
        <input type="range" min="0" max="1" step="0.01" id="volume">
    </div>

    <div class="song-list" id="songList"></div>
</div>

<script>
const songs = [
{
    title: "Dream Track",
    src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
    cover: "https://picsum.photos/id/237/400/300"
},
{
    title: "Chill Vibes",
    src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
    cover: "https://picsum.photos/id/238/400/300"
},
{
    title: "Night Mood",
    src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
    cover: "https://picsum.photos/id/239/400/300"
}
];

let songIndex = 0;

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const cover = document.getElementById("cover");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const progressContainer = document.getElementById("progressContainer");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");
const volume = document.getElementById("volume");
const songList = document.getElementById("songList");

function loadSong(index) {
    title.innerText = songs[index].title;
    audio.src = songs[index].src;
    cover.src = songs[index].cover;
    updateActiveSong();
}

function playPause() {
    if (audio.paused) {
        audio.play();
        playBtn.innerText = "⏸";
    } else {
        audio.pause();
        playBtn.innerText = "▶";
    }
}

function nextSong() {
    songIndex = (songIndex + 1) % songs.length;
    loadSong(songIndex);
    audio.play();
    playBtn.innerText = "⏸";
}

function prevSong() {
    songIndex = (songIndex - 1 + songs.length) % songs.length;
    loadSong(songIndex);
    audio.play();
    playBtn.innerText = "⏸";
}

audio.addEventListener("timeupdate", () => {
    const { currentTime, duration } = audio;
    const percent = (currentTime / duration) * 100;
    progress.style.width = percent + "%";
    currentTimeEl.innerText = formatTime(currentTime);
    durationEl.innerText = formatTime(duration);
});

progressContainer.addEventListener("click", (e) => {
    const width = progressContainer.clientWidth;
    const clickX = e.offsetX;
    audio.currentTime = (clickX / width) * audio.duration;
});

function formatTime(time) {
    if (isNaN(time)) return "0:00";
    const minutes = Math.floor(time / 60);
    const seconds = Math.floor(time % 60).toString().padStart(2, "0");
    return minutes + ":" + seconds;
}

volume.addEventListener("input", () => {
    audio.volume = volume.value;
});

function createSongList() {
    songs.forEach((song, index) => {
        const div = document.createElement("div");
        div.classList.add("song-item");
        div.innerText = song.title;
        div.onclick = () => {
            songIndex = index;
            loadSong(songIndex);
            audio.play();
            playBtn.innerText = "⏸";
        };
        songList.appendChild(div);
    });
}

function updateActiveSong() {
    const items = document.querySelectorAll(".song-item");
    items.forEach(item => item.classList.remove("active"));
    items[songIndex].classList.add("active");
}

createSongList();
loadSong(songIndex);
</script>

</body>
</html>
